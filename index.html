<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Website moved</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #18354b; background: #f3f6f8; }
    body { margin: 0; padding: 2rem 1rem; }
    main { max-width: 38rem; margin: 8vh auto; padding: 2rem; background: #fff; border: 1px solid #d6e0e7; border-radius: .75rem; }
    h1 { margin-top: 0; font-size: 1.8rem; line-height: 1.2; }
    p { line-height: 1.6; }
    a { color: #135ba4; text-underline-offset: .2em; overflow-wrap: anywhere; }
    a:focus-visible { outline: 3px solid #bf6500; outline-offset: 4px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main id="forwarding">
    <h1>The website has moved</h1>
    <p>This page will take you to the new website.</p>
    <p><a id="destination" href="https://stephan-kramer.github.io/">Open the new website</a></p>
    <noscript><p>JavaScript is disabled. Use the link above to open the homepage.</p></noscript>
  </main>
  <main id="not-found" hidden>
    <h1>Page not found</h1>
    <p>This page is not available.</p>
  </main>
  <script>
    (() => {
      let path = window.location.pathname;
      try { path = decodeURIComponent(path); } catch {}
      path = path.replace(/\\/g, '/');
      if (/^\/+research(?:\/|$)/i.test(path)) {
        document.title = 'Page not found';
        document.getElementById('forwarding').hidden = true;
        document.getElementById('not-found').hidden = false;
        return;
      }
      const destination = new URL('https://stephan-kramer.github.io/');
      destination.pathname = window.location.pathname;
      destination.search = window.location.search;
      destination.hash = '';
      document.getElementById('destination').href = destination.href;
      window.location.replace(destination.href);
    })();
  </script>
</body>
</html>
